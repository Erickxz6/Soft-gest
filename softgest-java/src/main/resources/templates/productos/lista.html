<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">Productos</h4>
        <div class="d-flex gap-2">
            <a href="/productos?criticos=true" class="btn btn-outline-danger btn-sm"><i class="bi bi-exclamation-triangle me-1"></i>Stock crítico</a>
            <a href="/productos/nuevo" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nuevo producto</a>
        </div>
    </div>
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" th:text="${success}"><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white">
            <form class="d-flex gap-2" method="get"><input type="text" name="q" class="form-control form-control-sm" placeholder="Buscar producto..." th:value="${q}"><button class="btn btn-outline-secondary btn-sm"><i class="bi bi-search"></i></button></form>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light"><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Mínimo</th><th>Acciones</th></tr></thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.nombre}"></td><td th:text="${p.categoria?.nombre}"></td>
                    <td>$<span th:text="${#numbers.formatDecimal(p.precio, 0, 'COMMA', 0, 'POINT')}"></span></td>
                    <td><span class="badge" th:classappend="'bg-' + ${p.semaforo}" th:text="${p.stock}"></span></td>
                    <td th:text="${p.stockMinimo}"></td>
                    <td><a th:href="@{'/productos/editar/' + ${p.id}}" class="btn btn-outline-primary btn-sm"><i class="bi bi-pencil"></i></a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
