<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">Usuarios</h4>
        <a href="/usuarios/nuevo" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nuevo usuario</a>
    </div>
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" th:text="${success}"><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    <div class="card border-0 shadow-sm"><div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.nombreCompleto}"></td><td th:text="${u.correo}"></td>
                <td><span class="badge" th:classappend="${u.rol.name() == 'ADMIN'} ? 'bg-purple' : (${u.rol.name() == 'VENDEDOR'} ? 'bg-primary' : (${u.rol.name() == 'BODEGUERO'} ? 'bg-success' : 'bg-warning text-dark'))" th:text="${u.rol}"></span></td>
                <td><span class="badge" th:classappend="${u.activo} ? 'bg-success' : 'bg-secondary'" th:text="${u.activo} ? 'Activo' : 'Inactivo'"></span></td>
                <td><a th:href="@{'/usuarios/editar/' + ${u.id}}" class="btn btn-outline-primary btn-sm"><i class="bi bi-pencil"></i></a></td>
            </tr>
            </tbody>
        </table>
    </div></div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
