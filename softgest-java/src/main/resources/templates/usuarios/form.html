<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuario')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content">
    <h4 class="fw-bold mb-4" th:text="${usuario.id != null} ? 'Editar usuario' : 'Nuevo usuario'">Usuario</h4>
    <div class="card border-0 shadow-sm"><div class="card-body">
        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="row g-3">
                <div class="col-md-4"><label class="form-label small fw-semibold">Nombre</label><input type="text" th:field="*{nombre}" class="form-control" required></div>
                <div class="col-md-4"><label class="form-label small fw-semibold">Apellido</label><input type="text" th:field="*{apellido}" class="form-control" required></div>
                <div class="col-md-4"><label class="form-label small fw-semibold">Correo</label><input type="email" th:field="*{correo}" class="form-control" required></div>
                <div class="col-md-4"><label class="form-label small fw-semibold">Contraseña</label><input type="password" th:field="*{contrasena}" class="form-control" th:required="${usuario.id == null}" th:placeholder="${usuario.id != null} ? 'Dejar vacío para no cambiar' : ''"></div>
                <div class="col-md-4"><label class="form-label small fw-semibold">Rol</label><select th:field="*{rol}" class="form-select"><option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option></select></div>
                <div class="col-md-4 d-flex align-items-end"><div class="form-check"><input type="checkbox" th:field="*{activo}" class="form-check-input"><label class="form-check-label">Activo</label></div></div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar</button>
                <a href="/usuarios" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div></div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
