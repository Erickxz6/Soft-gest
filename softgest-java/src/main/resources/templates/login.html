<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión – SoftGest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>body{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}.card{border:none;border-radius:1rem;box-shadow:0 1rem 3rem rgba(0,0,0,.3)}</style>
</head>
<body>
<div style="width:400px">
    <div class="text-center mb-4">
        <div class="bg-primary d-inline-flex p-3 rounded-4 mb-3"><i class="bi bi-box-seam text-white fs-1"></i></div>
        <h2 class="text-white fw-bold">SoftGest</h2>
        <p class="text-white-50">Sistema de Gestión Comercial</p>
    </div>
    <div class="card p-4">
        <h5 class="fw-bold mb-3">Iniciar sesión</h5>
        <div th:if="${param.error}" class="alert alert-danger py-2 small">Correo o contraseña incorrectos</div>
        <div th:if="${param.logout}" class="alert alert-info py-2 small">Sesión cerrada exitosamente</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Correo electrónico</label>
                <input type="email" name="username" class="form-control" placeholder="usuario@softgest.com" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••" required>
            </div>
            <button class="btn btn-primary w-100 fw-semibold">Ingresar</button>
        </form>
        <div class="bg-light rounded p-3 mt-3">
            <p class="small fw-semibold text-primary mb-1">Usuarios de prueba (clave: 123456)</p>
            <p class="small text-muted mb-0">Admin: admin@softgest.com<br>Vendedor: vendedor@softgest.com<br>Bodeguero: bodeguero@softgest.com</p>
        </div>
    </div>
</div>
</body></html>
