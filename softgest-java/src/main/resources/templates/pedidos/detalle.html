<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedido')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-0">Pedido <span th:text="${pedido.codigo}"></span></h4>
            <small class="text-muted" th:text="${#temporals.format(pedido.creadoEn, 'dd MMMM yyyy, HH:mm')}"></small>
        </div>
        <span class="badge fs-6" th:classappend="${pedido.estado.name() == 'PENDIENTE'} ? 'bg-warning text-dark' : (${pedido.estado.name() == 'CANCELADO'} ? 'bg-danger' : (${pedido.estado.name() == 'ENTREGADO'} ? 'bg-success' : 'bg-primary'))" th:text="${pedido.estado}"></span>
    </div>
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" th:text="${success}"><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="row g-4">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm mb-3"><div class="card-body">
                <h6 class="fw-semibold mb-3">Detalle del pedido</h6>
                <table class="table">
                    <thead class="table-light"><tr><th>Producto</th><th class="text-end">Precio unit.</th><th class="text-center">Cantidad</th><th class="text-end">Subtotal</th></tr></thead>
                    <tbody>
                    <tr th:each="d : ${pedido.detalles}">
                        <td th:text="${d.producto.nombre}"></td>
                        <td class="text-end">$<span th:text="${#numbers.formatDecimal(d.precioUnitario, 0, 'COMMA', 0, 'POINT')}"></span></td>
                        <td class="text-center" th:text="${d.cantidad}"></td>
                        <td class="text-end fw-semibold">$<span th:text="${#numbers.formatDecimal(d.subtotal, 0, 'COMMA', 0, 'POINT')}"></span></td>
                    </tr>
                    </tbody>
                    <tfoot><tr><td colspan="3" class="text-end fw-bold">TOTAL:</td><td class="text-end fw-bold fs-5">$<span th:text="${#numbers.formatDecimal(pedido.total, 0, 'COMMA', 0, 'POINT')}"></span></td></tr></tfoot>
                </table>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm mb-3"><div class="card-body">
                <h6 class="fw-semibold mb-2">Información</h6>
                <p class="mb-1 small"><strong>Cliente:</strong> <span th:text="${pedido.cliente.nombre}"></span></p>
                <p class="mb-1 small"><strong>Documento:</strong> <span th:text="${pedido.cliente.documento}"></span></p>
                <p class="mb-1 small"><strong>Vendedor:</strong> <span th:text="${pedido.vendedor.nombreCompleto}"></span></p>
                <p th:if="${pedido.observaciones}" class="mb-0 small"><strong>Observaciones:</strong> <span th:text="${pedido.observaciones}"></span></p>
            </div></div>
            <div th:if="${pedido.estado.name() != 'ENTREGADO' && pedido.estado.name() != 'CANCELADO'}" class="card border-0 shadow-sm"><div class="card-body">
                <h6 class="fw-semibold mb-2">Cambiar estado</h6>
                <form th:action="@{'/pedidos/' + ${pedido.id} + '/estado'}" method="post" class="d-flex gap-2">
                    <select name="estado" class="form-select form-select-sm">
                        <option th:each="e : ${estadosPosibles}" th:value="${e}" th:text="${e}" th:selected="${e == pedido.estado}"></option>
                    </select>
                    <button class="btn btn-primary btn-sm">Actualizar</button>
                </form>
            </div></div>
        </div>
    </div>
    <a href="/pedidos" class="btn btn-outline-secondary mt-3"><i class="bi bi-arrow-left me-1"></i>Volver a pedidos</a>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
