<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo Pedido')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content">
    <h4 class="fw-bold mb-4">Nuevo Pedido</h4>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form action="/pedidos/crear" method="post" id="pedidoForm">
        <div class="row g-4">
            <div class="col-md-8">
                <div class="card border-0 shadow-sm"><div class="card-body">
                    <h6 class="fw-semibold mb-3"><i class="bi bi-person me-2"></i>Cliente</h6>
                    <select name="clienteId" class="form-select mb-4" required>
                        <option value="">Seleccione un cliente...</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre + ' – ' + c.documento}"></option>
                    </select>
                    <h6 class="fw-semibold mb-3"><i class="bi bi-box me-2"></i>Productos</h6>
                    <div id="items">
                        <div class="row g-2 mb-2 item-row">
                            <div class="col-md-7"><select name="productoIds" class="form-select form-select-sm" required>
                                <option value="">Seleccionar producto...</option>
                                <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre + ' – $' + p.precio + ' (stock: ' + p.stock + ')'}"></option>
                            </select></div>
                            <div class="col-md-3"><input type="number" name="cantidades" class="form-control form-control-sm" placeholder="Cantidad" min="1" value="1" required></div>
                            <div class="col-md-2"><button type="button" class="btn btn-outline-danger btn-sm w-100" onclick="this.closest('.item-row').remove()"><i class="bi bi-trash"></i></button></div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline-secondary btn-sm mt-2" onclick="addItem()"><i class="bi bi-plus-lg me-1"></i>Agregar producto</button>
                    <div class="mt-3"><label class="form-label small fw-semibold">Observaciones</label><textarea name="observaciones" class="form-control" rows="2"></textarea></div>
                </div></div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm"><div class="card-body">
                    <h6 class="fw-semibold mb-3">Resumen</h6>
                    <p class="text-muted small">Verifique los datos antes de confirmar el pedido.</p>
                    <button type="submit" class="btn btn-primary w-100 fw-semibold"><i class="bi bi-check-lg me-1"></i>Crear Pedido</button>
                    <a href="/pedidos" class="btn btn-outline-secondary w-100 mt-2">Cancelar</a>
                </div></div>
            </div>
        </div>
    </form>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
const itemsDiv = document.getElementById('items');
const template = itemsDiv.querySelector('.item-row').cloneNode(true);
function addItem() {
    const row = template.cloneNode(true);
    row.querySelector('select').value = '';
    row.querySelector('input').value = '1';
    itemsDiv.appendChild(row);
}
</script>
</body></html>
