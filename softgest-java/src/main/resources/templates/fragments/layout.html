<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' – SoftGest'">SoftGest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
<!-- NAVBAR -->
<nav th:fragment="navbar" class="navbar navbar-dark bg-dark fixed-top px-3">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/"><i class="bi bi-box-seam"></i> <strong>SoftGest</strong></a>
    <div class="d-flex align-items-center gap-3 text-white-50 small">
        <span sec:authentication="name">usuario</span>
        <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</a>
    </div>
</nav>

<!-- SIDEBAR -->
<div th:fragment="sidebar" class="sidebar bg-dark text-white">
    <div class="p-3 pt-4">
        <div class="mb-4">
            <small class="text-white-50 text-uppercase">Menú</small>
        </div>
        <ul class="nav flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-white" href="/"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="/clientes"><i class="bi bi-people me-2"></i>Clientes</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="/productos"><i class="bi bi-box me-2"></i>Productos</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="/pedidos"><i class="bi bi-cart3 me-2"></i>Pedidos</a></li>
            <li sec:authorize="hasRole('ADMIN')" class="nav-item"><a class="nav-link text-white" href="/usuarios"><i class="bi bi-person-gear me-2"></i>Usuarios</a></li>
        </ul>
    </div>
</div>

<!-- SCRIPTS -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
