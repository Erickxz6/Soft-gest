<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content">
    <h4 class="fw-bold mb-1">Dashboard</h4>
    <p class="text-muted small mb-4">Resumen general de SoftGest Comercial S.A.S.</p>

    <!-- KPI Cards -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm"><div class="card-body d-flex align-items-center gap-3">
                <div class="bg-primary bg-opacity-10 rounded-3 p-3"><i class="bi bi-cart3 fs-4 text-primary"></i></div>
                <div><h3 class="mb-0 fw-bold" th:text="${pedidosHoy}">0</h3><small class="text-muted">Pedidos hoy</small></div>
            </div></div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm"><div class="card-body d-flex align-items-center gap-3">
                <div class="bg-success bg-opacity-10 rounded-3 p-3"><i class="bi bi-currency-dollar fs-4 text-success"></i></div>
                <div><h3 class="mb-0 fw-bold">$<span th:text="${#numbers.formatDecimal(ventasHoy, 0, 'COMMA', 0, 'POINT')}">0</span></h3><small class="text-muted">Ventas hoy</small></div>
            </div></div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm"><div class="card-body d-flex align-items-center gap-3">
                <div class="bg-warning bg-opacity-10 rounded-3 p-3"><i class="bi bi-clock fs-4 text-warning"></i></div>
                <div><h3 class="mb-0 fw-bold" th:text="${pedidosPendientes}">0</h3><small class="text-muted">Pendientes</small></div>
            </div></div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm"><div class="card-body d-flex align-items-center gap-3">
                <div class="bg-info bg-opacity-10 rounded-3 p-3"><i class="bi bi-truck fs-4 text-info"></i></div>
                <div><h3 class="mb-0 fw-bold" th:text="${pedidosDespachados}">0</h3><small class="text-muted">Despachados</small></div>
            </div></div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-4">
            <div class="card border-0 shadow-sm"><div class="card-body d-flex align-items-center gap-3">
                <div class="bg-primary bg-opacity-10 rounded-3 p-3"><i class="bi bi-people fs-4 text-primary"></i></div>
                <div><h4 class="mb-0 fw-bold" th:text="${totalClientes}">0</h4><small class="text-muted">Clientes activos</small></div>
            </div></div>
        </div>
        <div class="col-sm-6 col-lg-4">
            <div class="card border-0 shadow-sm"><div class="card-body d-flex align-items-center gap-3">
                <div class="bg-teal bg-opacity-10 rounded-3 p-3"><i class="bi bi-box-seam fs-4 text-success"></i></div>
                <div><h4 class="mb-0 fw-bold" th:text="${totalProductos}">0</h4><small class="text-muted">Productos activos</small></div>
            </div></div>
        </div>
        <div class="col-sm-6 col-lg-4">
            <div class="card border-0 shadow-sm"><div class="card-body d-flex align-items-center gap-3">
                <div class="rounded-3 p-3" th:classappend="${productosCriticos.size() > 0} ? 'bg-danger bg-opacity-10' : 'bg-secondary bg-opacity-10'">
                    <i class="bi bi-exclamation-triangle fs-4" th:classappend="${productosCriticos.size() > 0} ? 'text-danger' : 'text-secondary'"></i></div>
                <div><h4 class="mb-0 fw-bold" th:text="${productosCriticos.size()}">0</h4><small class="text-muted">Stock crítico</small></div>
            </div></div>
        </div>
    </div>

    <!-- Productos con stock crítico -->
    <div th:if="${!productosCriticos.isEmpty()}" class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-semibold"><i class="bi bi-exclamation-triangle text-danger me-2"></i>Productos con stock crítico</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light"><tr><th>Producto</th><th>Categoría</th><th>Stock</th><th>Mínimo</th></tr></thead>
                <tbody>
                <tr th:each="p : ${productosCriticos}">
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.categoria?.nombre}"></td>
                    <td><span class="badge" th:classappend="${p.stock == 0} ? 'bg-danger' : 'bg-warning'" th:text="${p.stock}"></span></td>
                    <td th:text="${p.stockMinimo}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
