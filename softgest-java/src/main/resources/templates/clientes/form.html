<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cliente')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content">
    <h4 class="fw-bold mb-4" th:text="${cliente.id != null} ? 'Editar cliente' : 'Nuevo cliente'">Cliente</h4>
    <div class="card border-0 shadow-sm"><div class="card-body">
        <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label small fw-semibold">Nombre</label><input type="text" th:field="*{nombre}" class="form-control" required></div>
                <div class="col-md-3"><label class="form-label small fw-semibold">Documento</label><input type="text" th:field="*{documento}" class="form-control" required></div>
                <div class="col-md-3"><label class="form-label small fw-semibold">Tipo</label><select th:field="*{tipo}" class="form-select"><option value="PERSONA">Persona</option><option value="EMPRESA">Empresa</option></select></div>
                <div class="col-md-4"><label class="form-label small fw-semibold">Teléfono</label><input type="text" th:field="*{telefono}" class="form-control"></div>
                <div class="col-md-4"><label class="form-label small fw-semibold">Correo</label><input type="email" th:field="*{correo}" class="form-control"></div>
                <div class="col-md-4"><label class="form-label small fw-semibold">Dirección</label><input type="text" th:field="*{direccion}" class="form-control"></div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar</button>
                <a href="/clientes" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div></div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
